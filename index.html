<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>블랙야크 100대 명산 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --ink:#1a1a2e; --forest:#2d5016; --moss:#4a7c26;
  --mist:#c8dfa0; --stone:#8b9467; --cream:#f5f0e8;
  --gold:#c9a84c; --snow:#fff; --cbg:rgba(245,240,232,0.98);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:'Noto Sans KR',sans-serif;background:var(--ink);color:var(--ink)}
body{display:flex;flex-direction:column;height:100dvh}

/* HEADER */
header{z-index:1000;background:var(--forest);padding:0 16px;height:56px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:2px solid var(--gold);box-shadow:0 4px 20px rgba(0,0,0,.4)}
.hl{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.htitle{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;color:var(--cream);white-space:nowrap}
.hsub{font-size:9px;color:var(--mist);letter-spacing:.5px}
.hstats{display:flex;gap:16px;flex-shrink:0}
.stat{text-align:center}
.snum{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;color:var(--gold);line-height:1}
.slbl{font-size:9px;color:var(--mist);margin-top:1px;white-space:nowrap}

/* MAP */
#mapwrap{flex:1;position:relative;overflow:hidden;min-height:0}
#map{width:100%;height:100%}
.leaflet-container{background:#1a2535}
.leaflet-popup-content-wrapper{display:none}

/* FILTER */
#filterbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:900;
  display:flex;gap:6px;background:rgba(26,26,46,.9);backdrop-filter:blur(12px);
  padding:7px 10px;border-radius:40px;border:1px solid rgba(201,168,76,.3);
  box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:calc(100vw - 28px);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#filterbar::-webkit-scrollbar{display:none}
.fbtn{padding:5px 12px;border-radius:20px;border:1px solid transparent;
  font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;cursor:pointer;
  transition:all .2s;color:var(--mist);background:transparent;white-space:nowrap;
  min-height:32px;display:flex;align-items:center;-webkit-appearance:none}
.fbtn:active{color:var(--snow)}
.fbtn.active{background:var(--gold);color:var(--ink);font-weight:700}

/* DESKTOP SEARCH */
#searchwrap{position:absolute;top:12px;right:12px;z-index:900}
#searchbox{background:rgba(26,26,46,.9);backdrop-filter:blur(12px);border:1px solid rgba(201,168,76,.3);
  border-radius:25px;padding:7px 14px;color:var(--cream);font-family:'Noto Sans KR',sans-serif;
  font-size:13px;width:160px;outline:none;-webkit-appearance:none;min-height:36px}
#searchbox::placeholder{color:var(--stone)}
#searchbox:focus{border-color:var(--gold)}

/* LEGEND */
#legend{position:absolute;bottom:24px;left:12px;z-index:900;background:rgba(26,26,46,.9);
  backdrop-filter:blur(12px);border:1px solid rgba(201,168,76,.25);border-radius:10px;
  padding:10px 12px;color:var(--cream);font-size:11px;min-width:120px}
#legend h4{font-family:'Noto Serif KR',serif;font-size:11px;color:var(--gold);margin-bottom:7px}
.li{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.ld{width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);flex-shrink:0}

/* COUNT */
#countbadge{position:absolute;bottom:24px;right:12px;z-index:900;background:rgba(26,26,46,.9);
  backdrop-filter:blur(12px);border:1px solid rgba(201,168,76,.25);border-radius:8px;
  padding:6px 12px;color:var(--gold);font-family:'Noto Serif KR',serif;font-size:12px;text-align:center}

/* SHARED CARD STYLES */
.ch{background:linear-gradient(135deg,var(--forest),var(--moss));padding:14px 16px 12px;position:relative}
.cno{font-size:10px;color:var(--mist);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
.cname{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:700;color:var(--snow);line-height:1.1}
.cpeak{font-size:12px;color:var(--mist);margin-top:2px}
.chbadge{position:absolute;top:14px;right:14px;background:var(--gold);color:var(--ink);
  font-family:'Noto Serif KR',serif;font-weight:700;font-size:15px;padding:3px 10px;border-radius:20px}
.cb{padding:12px 16px 16px}
.crow{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px}
.crow:last-child{margin-bottom:0}
.cico{font-size:14px;margin-top:1px;flex-shrink:0;width:20px;text-align:center}
.clbl{font-size:10px;color:var(--stone);letter-spacing:.5px;text-transform:uppercase;margin-bottom:1px}
.cval{font-size:13px;color:var(--ink);line-height:1.45}
.dbadge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700}
.de{background:#d4edda;color:#155724}
.dm{background:#fff3cd;color:#856404}
.dh{background:#f8d7da;color:#721c24}
.dx{background:#d1ecf1;color:#0c5460}
.cdiv{height:1px;background:linear-gradient(90deg,transparent,rgba(74,124,38,.2),transparent);margin:8px 0}
.rtag{display:inline-block;background:var(--mist);color:var(--forest);font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;margin-right:4px}

/* DESKTOP HOVER CARD */
#hcard{position:fixed;z-index:9999;width:320px;background:var(--cbg);border-radius:14px;
  box-shadow:0 8px 40px rgba(0,0,0,.35),0 0 0 1px rgba(201,168,76,.3);
  opacity:0;pointer-events:none;transform:translateY(6px) scale(.97);
  transition:opacity .18s,transform .18s;overflow:hidden;font-size:13px}
#hcard.vis{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}

/* BOTTOM SHEET */
#sheet{position:fixed;bottom:0;left:0;right:0;z-index:9000;background:var(--cbg);
  border-radius:20px 20px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.4);
  border-top:2px solid rgba(201,168,76,.4);transform:translateY(100%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);max-height:78dvh;
  overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
#sheet.open{transform:translateY(0)}
.shandle{display:flex;justify-content:center;padding:12px 0 4px;position:sticky;top:0;background:var(--cbg);z-index:1}
.shandle-bar{width:40px;height:4px;background:rgba(0,0,0,.15);border-radius:2px}
#sclose{position:absolute;top:10px;right:14px;width:30px;height:30px;border-radius:50%;
  background:rgba(0,0,0,.08);border:none;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--ink);z-index:2}

/* OVERLAY */
#overlay{position:fixed;inset:0;z-index:8999;background:rgba(0,0,0,.3);opacity:0;
  transition:opacity .3s;pointer-events:none;display:none}
#overlay.show{opacity:1;pointer-events:auto}

/* MOBILE SEARCH */
#msearchwrap{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:900;
  width:calc(100% - 90px);max-width:320px;display:none}
#msearch{width:100%;background:rgba(26,26,46,.92);backdrop-filter:blur(12px);
  border:1px solid rgba(201,168,76,.3);border-radius:25px;padding:9px 18px;
  color:var(--cream);font-family:'Noto Sans KR',sans-serif;font-size:14px;
  outline:none;-webkit-appearance:none;min-height:40px}
#msearch::placeholder{color:var(--stone)}
#msearch:focus{border-color:var(--gold)}

/* RESPONSIVE */
@media(max-width:768px){
  #hcard{display:none!important}
  #sheet{display:block}
  #overlay{display:block}
}
@media(max-width:480px){
  .hstats{display:none}
  .hsub{display:none}
  #legend{display:none}
  #searchwrap{display:none}
  #msearchwrap{display:block}
  #countbadge{bottom:130px;right:10px;font-size:11px;padding:5px 10px}
}
@media(max-width:480px){
  .leaflet-control-zoom{margin-bottom:140px!important;margin-right:10px!important}
}
</style>
</head>
<body>
<header>
  <div class="hl">
    <div class="logo">⛰️</div>
    <div>
      <div class="htitle">블랙야크 100대 명산</div>
      <div class="hsub">BLACK YAK 100 FAMOUS MOUNTAINS</div>
    </div>
  </div>
  <div class="hstats">
    <div class="stat"><div class="snum">100</div><div class="slbl">명산</div></div>
    <div class="stat"><div class="snum">1,950m</div><div class="slbl">최고봉 한라산</div></div>
    <div class="stat"><div class="snum">327m</div><div class="slbl">최저봉 팔봉산</div></div>
  </div>

<div id="mapwrap">
  <div id="map"></div>

  <div id="filterbar">
    <button class="fbtn active" data-r="전체">전체</button>
    <button class="fbtn" data-r="수도권">수도권</button>

    <button class="fbtn" data-r="충청">충청</button>

    <button class="fbtn" data-r="제주">제주</button>

  <div id="searchwrap">
    <input id="searchbox" type="text" placeholder="🔍 산 이름 검색...">

  <div id="legend">

    <div class="li"><div class="ld" style="background:#e8320a"></div><span>1500m 이상</span></div>
    <div class="li"><div class="ld" style="background:#f97316"></div><span>1000–1499m</span></div>
    <div class="li"><div class="ld" style="background:#eab308"></div><span>700–999m</span></div>

  <div id="countbadge">표시 <span id="cnt">100</span>개</div>

  <div id="msearchwrap">
    <input id="msearch" type="search" placeholder="🔍 산 이름 검색..." autocomplete="off">
  </div>
</div>

<!-- 데스크탑 호버 카드 -->
<div id="hcard">
  <div class="ch">

    <div class="cname" id="d-name"></div>

    <div class="crow"><div class="cico">📖</div><div><div class="clbl">이름의 어원</div><div class="cval" id="d-ety"></div></div></div>
  </div>
</div>

<!-- 모바일 바텀 시트 -->
<div id="overlay"></div>
<div id="sheet">
  <div class="shandle"><div class="shandle-bar"></div></div>
  <button id="sclose">✕</button>
  <div class="ch">
    <div class="cno" id="s-no"></div>
    <div class="cname" id="s-name"></div>
    <div class="cpeak" id="s-peak"></div>
    <div class="chbadge" id="s-ht"></div>
  </div>
  <div class="cb">
    <div class="crow"><div class="cico">📍</div><div><div class="clbl">위치</div><div class="cval" id="s-loc"></div></div></div>
    <div class="cdiv"></div>
    <div class="crow"><div class="cico">⚡</div><div><div class="clbl">난이도</div><div class="cval" id="s-diff"></div></div></div>
    <div class="crow"><div class="cico">🥾</div><div><div class="clbl">주요 등산 코스</div><div class="cval" id="s-crs"></div></div></div>
    <div class="crow"><div class="cico">🏃</div><div><div class="clbl">최단 코스</div><div class="cval" id="s-sh"></div></div></div>
    <div class="cdiv"></div>
    <div class="crow"><div class="cico">📖</div><div><div class="clbl">이름의 어원</div><div class="cval" id="s-ety"></div></div></div>
  </div>
</div>

<script>
const MT = [
  {no:1,name:"마니산",r:"수도권",loc:"인천 강화도",lat:37.468,lng:126.428,h:472,peak:"정상",d:"중",dc:"dm",crs:"참성단 코스 (2.9km, 약 1시간 30분)|동문 코스 (4.2km, 약 2시간 30분)|계단 코스 (3.5km, 약 2시간)",sh:"참성단 코스 (2.9km, 1시간 30분)",ety:"'마니'는 산스크리트어로 보석·여의주를 뜻하며, 단군이 하늘에 제사를 지낸 신성한 산이라는 뜻을 담고 있다."},
  {no:2,name:"청계산",r:"수도권",loc:"서울 서초구",lat:37.416,lng:127.054,h:582,peak:"매봉",d:"하",dc:"de",crs:"원터골 코스 (4.5km, 약 2시간)|청계사 코스 (5km, 약 2시간 30분)|옛골 코스 (3km, 약 1시간 30분)",sh:"옛골 코스 (3km, 1시간 30분)",ety:"맑고 깨끗한 계곡물이 흐르는 산이라 하여 '맑을 청(淸) + 계곡 계(溪)'로 청계산이라 불린다."},
  {no:3,name:"수락산",r:"수도권",loc:"서울 노원구",lat:37.672,lng:127.082,h:637,peak:"주봉",d:"하",dc:"de",crs:"당고개 코스 (4km, 약 2시간)|학림사 코스 (5km, 약 2시간 30분)|철쭉 능선 코스 (6km, 약 3시간)",sh:"당고개 코스 (4km, 2시간)",ety:"산에서 물이 쏟아져 내린다 하여 '물 수(水) + 떨어질 락(落)'으로 수락산이라 불린다."},
  {no:4,name:"도봉산",r:"수도권",loc:"서울 강북구",lat:37.712,lng:127.020,h:730,peak:"신선대",d:"중",dc:"dm",crs:"도봉탐방 코스 (6km, 약 3시간)|망월사 코스 (5km, 약 2시간 30분)|원도봉 코스 (4km, 약 2시간)",sh:"원도봉 코스 (4km, 2시간)",ety:"'도(道)를 닦는 봉우리'라는 뜻으로 예로부터 수행처로 알려진 산이다."},
  {no:5,name:"북한산",r:"수도권",loc:"경기 고양",lat:37.659,lng:126.977,h:837,peak:"백운대",d:"중상",dc:"dm",crs:"대서문 코스 (6.5km, 약 3시간 30분)|우이동 코스 (7km, 약 4시간)|북한산성 코스 (8km, 약 4시간 30분)",sh:"우이동→백운대 코스 (5km, 3시간)",ety:"한강의 북쪽에 있는 큰 산이라는 뜻으로, 삼국시대에는 부아악(負兒岳)이라 불리기도 했다."},
  {no:6,name:"명지산",r:"강원",loc:"경기 가평",lat:37.902,lng:127.402,h:1267,peak:"정상",d:"중상",dc:"dm",crs:"익근리 코스 (10km, 약 5시간)|명지계곡 코스 (8km, 약 4시간 30분)|아침고요 코스 (7km, 약 4시간)",sh:"명지계곡 코스 (8km, 4시간 30분)",ety:"'밝을 명(明) + 땅 지(地)'로, 밝고 넓은 지형을 가진 산이라는 의미."},
  {no:7,name:"연인산",r:"강원",loc:"경기 가평",lat:37.878,lng:127.479,h:1068,peak:"정상",d:"중",dc:"dm",crs:"용추계곡 코스 (10km, 약 5시간)|우정의 길 코스 (7km, 약 3시간 30분)",sh:"우정의 길 코스 (7km, 3시간 30분)",ety:"연인들이 함께 오르기 좋다 하여 연인산이라 불린다. 봄 진달래와 철쭉이 아름다운 명소다."},
  {no:8,name:"유명산",r:"강원",loc:"경기 가평",lat:37.780,lng:127.536,h:862,peak:"정상",d:"중",dc:"dm",crs:"유명산휴양림 코스 (8km, 약 4시간)|어비계곡 코스 (6km, 약 3시간)",sh:"어비계곡 코스 (6km, 3시간)",ety:"옛 지명인 '유명(幽明)'에서 왔으며 그윽하고 밝은 산이라는 뜻이다."},
  {no:9,name:"용문산",r:"강원",loc:"경기 양평",lat:37.547,lng:127.601,h:1157,peak:"정상",d:"중상",dc:"dm",crs:"용문사 코스 (9km, 약 4시간 30분)|삼거리 코스 (8km, 약 4시간)|신점리 코스 (10km, 약 5시간)",sh:"삼거리 코스 (8km, 4시간)",ety:"용이 살았다는 전설과 문 모양의 바위에서 유래. 천년 은행나무로도 유명하다."},

function gc(h){return h>=1500?'#e8320a':h>=1000?'#f97316':h>=700?'#eab308':'#84cc16'}
function mkIcon(m){
  const c=gc(m.h),r=Math.max(8,Math.min(14,6+m.h/200));
  return L.divIcon({className:'',iconSize:[r*2+4,r*2+4],iconAnchor:[r+2,r+2],
    html:`<svg width="${r*2+4}" height="${r*2+4}" viewBox="0 0 ${r*2+4} ${r*2+4}"><circle cx="${r+2}" cy="${r+2}" r="${r}" fill="${c}" stroke="white" stroke-width="1.8" opacity=".93"/><circle cx="${r+2}" cy="${r+2}" r="${r*.42}" fill="white" opacity=".5"/></svg>`});
}

function fill(p,m){
  document.getElementById(p+'-no').textContent=`NO. ${String(m.no).padStart(2,'0')}  ·  ${m.r}`;
  document.getElementById(p+'-name').textContent=m.name;
  document.getElementById(p+'-peak').textContent=`▲ 인증봉우리: ${m.peak}`;
  document.getElementById(p+'-ht').textContent=`${m.h}m`;
  document.getElementById(p+'-loc').innerHTML=`<span class="rtag">${m.loc.split(' ')[0]}</span>${m.loc}`;
  document.getElementById(p+'-diff').innerHTML=`<span class="dbadge ${m.dc}">${m.d}</span>`;
  document.getElementById(p+'-crs').innerHTML=m.crs.split('|').map(c=>`<div style="margin-bottom:3px">• ${c}</div>`).join('');
  document.getElementById(p+'-sh').innerHTML=`<span style="color:#2d5016;font-weight:600">⚡ ${m.sh}</span>`;
  document.getElementById(p+'-ety').textContent=m.ety;
}

const hcard=document.getElementById('hcard');
let hideT=null;
function showD(m,e){
  clearTimeout(hideT);fill('d',m);
  const mg=12,cw=320,ch=400;
  let x=e.originalEvent.clientX+16,y=e.originalEvent.clientY-20;
  if(x+cw>window.innerWidth-mg)x=e.originalEvent.clientX-cw-16;
  if(y+ch>window.innerHeight-mg)y=window.innerHeight-ch-mg;
  if(y<70)y=70;
  hcard.style.left=x+'px';hcard.style.top=y+'px';hcard.classList.add('vis');
}
function hideD(){hideT=setTimeout(()=>hcard.classList.remove('vis'),200)}

const sheet=document.getElementById('sheet'),ov=document.getElementById('overlay');
function openS(m){fill('s',m);sheet.classList.add('open');ov.classList.add('show');sheet.scrollTop=0}
function closeS(){sheet.classList.remove('open');ov.classList.remove('show')}
document.getElementById('sclose').addEventListener('click',closeS);
ov.addEventListener('click',closeS);
let ty=0;
sheet.addEventListener('touchstart',e=>{ty=e.touches[0].clientY},{passive:true});
sheet.addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-ty>60&&sheet.scrollTop<=0)closeS()},{passive:true});

let markers=[],activeR='전체';
MT.forEach(m=>{
  const mk=L.marker([m.lat,m.lng],{icon:mkIcon(m)}).addTo(map)
    .on('mouseover',e=>{if(!mob())showD(m,e)})
    .on('mouseout',()=>{if(!mob())hideD()})
    .on('click',e=>{mob()?openS(m):showD(m,e)});
  mk._m=m;markers.push(mk);
});
hcard.addEventListener('mouseenter',()=>clearTimeout(hideT));
hcard.addEventListener('mouseleave',hideD);

function doFilter(){
  const v=(document.getElementById('searchbox').value||document.getElementById('msearch').value).trim();
  let n=0;
  markers.forEach(mk=>{
    const m=mk._m,rm=activeR==='전체'||m.r===activeR,sm=!v||m.name.includes(v)||m.loc.includes(v);
    if(rm&&sm){mk.addTo(map);n++}else map.removeLayer(mk);
  });
  document.getElementById('cnt').textContent=n;
}
document.querySelectorAll('.fbtn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');activeR=b.dataset.r;doFilter();if(mob())closeS();
  });
});
document.getElementById('searchbox').addEventListener('input',doFilter);
document.getElementById('msearch').addEventListener('input',doFilter);
document.getElementById('msearch').addEventListener('focus',()=>setTimeout(()=>map.invalidateSize(),300));
document.getElementById('msearch').addEventListener('blur',()=>setTimeout(()=>map.invalidateSize(),300));
</script>
</body>
