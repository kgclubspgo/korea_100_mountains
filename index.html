<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>블랙야크 100대 명산 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --ink: #1a1a2e;
    --forest: #2d5016;
    --moss: #4a7c26;
    --mist: #c8dfa0;
    --stone: #8b9467;
    --cream: #f5f0e8;
    --gold: #c9a84c;
    --snow: #ffffff;
    --card-bg: rgba(245,240,232,0.98);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--ink);
    color: var(--ink);
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100dvh; /* dynamic viewport for mobile browsers */
  }

  /* ══════════════ HEADER ══════════════ */
  header {
    position: relative;
    z-index: 1000;
    background: var(--forest);
    padding: 0 16px;
    height: 56px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--gold);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }

  .logo-icon {
    width: 34px; height: 34px;
    background: var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .header-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--cream);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-sub {
    font-size: 9px;
    color: var(--mist);
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-stats {
    display: flex;
    gap: 16px;
    flex-shrink: 0;
  }

  .stat { text-align: center; color: var(--cream); }
  .stat-num {
    font-family: 'Noto Serif KR', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
  }
  .stat-label { font-size: 9px; color: var(--mist); margin-top: 1px; white-space: nowrap; }

  /* 모바일: 헤더 통계 숨김 */
  @media (max-width: 480px) {
    .header-stats { display: none; }
    .header-title { font-size: 15px; }
    .header-sub { display: none; }
  }

  /* ══════════════ MAP WRAP ══════════════ */
  #map-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  #map { width: 100%; height: 100%; }

  /* ══════════════ FILTER BAR ══════════════ */
  #filter-bar {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 900;
    display: flex;
    gap: 6px;
    background: rgba(26,26,46,0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 7px 10px;
    border-radius: 40px;
    border: 1px solid rgba(201,168,76,0.3);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    max-width: calc(100vw - 28px);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #filter-bar::-webkit-scrollbar { display: none; }

  .filter-btn {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid transparent;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--mist);
    background: transparent;
    white-space: nowrap;
    -webkit-appearance: none;
    /* 모바일 탭 영역 확보 */
    min-height: 32px;
    display: flex;
    align-items: center;
  }
  .filter-btn:hover, .filter-btn:active { color: var(--snow); border-color: rgba(201,168,76,0.5); }
  .filter-btn.active { background: var(--gold); color: var(--ink); border-color: var(--gold); font-weight: 700; }

  /* ══════════════ SEARCH ══════════════ */
  #search-wrap {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 900;
  }

  #search-box {
    background: rgba(26,26,46,0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 25px;
    padding: 7px 14px;
    color: var(--cream);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    width: 160px;
    outline: none;
    -webkit-appearance: none;
    min-height: 36px;
  }
  #search-box::placeholder { color: var(--stone); }
  #search-box:focus { border-color: var(--gold); }

  @media (max-width: 480px) {
    #search-wrap { display: none; } /* 모바일: 검색은 하단바로 이동 */
  }

  /* ══════════════ LEGEND ══════════════ */
  #legend {
    position: absolute;
    bottom: 24px;
    left: 12px;
    z-index: 900;
    background: rgba(26,26,46,0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(201,168,76,0.25);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--cream);
    font-size: 11px;
    min-width: 120px;
  }
  #legend h4 {
    font-family: 'Noto Serif KR', serif;
    font-size: 11px;
    color: var(--gold);
    margin-bottom: 7px;
  }
  .legend-item { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
  .legend-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.3);
    flex-shrink: 0;
  }

  @media (max-width: 480px) {
    #legend { display: none; } /* 모바일: 범례 숨김 (공간 절약) */
  }

  /* ══════════════ COUNT BADGE ══════════════ */
  #count-badge {
    position: absolute;
    bottom: 24px;
    right: 12px;
    z-index: 900;
    background: rgba(26,26,46,0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(201,168,76,0.25);
    border-radius: 8px;
    padding: 6px 12px;
    color: var(--gold);
    font-family: 'Noto Serif KR', serif;
    font-size: 12px;
    text-align: center;
  }

  @media (max-width: 480px) {
    #count-badge { bottom: 130px; right: 10px; font-size: 11px; padding: 5px 10px; }
  }

  /* ══════════════ DESKTOP HOVER CARD ══════════════ */
  #mountain-card {
    position: fixed;
    z-index: 9999;
    width: 320px;
    background: var(--card-bg);
    border-radius: 14px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(201,168,76,0.3);
    opacity: 0;
    pointer-events: none;
    transform: translateY(6px) scale(0.97);
    transition: opacity 0.18s ease, transform 0.18s ease;
    overflow: hidden;
    font-size: 13px;
  }
  #mountain-card.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0) scale(1);
  }

  /* 모바일: hover card 완전 비활성화 */
  @media (max-width: 768px) {
    #mountain-card { display: none !important; }
  }

  /* ══════════════ MOBILE BOTTOM SHEET ══════════════ */
  #bottom-sheet {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 9000;
    background: var(--card-bg);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -8px 40px rgba(0,0,0,0.4);
    border-top: 2px solid rgba(201,168,76,0.4);
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    max-height: 75dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #bottom-sheet.open { transform: translateY(0); }

  @media (max-width: 768px) {
    #bottom-sheet { display: block; }
  }

  /* sheet 손잡이 */
  .sheet-handle {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px 0 4px;
    position: sticky;
    top: 0;
    background: var(--card-bg);
    z-index: 1;
  }
  .sheet-handle-bar {
    width: 40px; height: 4px;
    background: rgba(0,0,0,0.15);
    border-radius: 2px;
  }

  /* sheet 닫기 버튼 */
  #sheet-close {
    position: absolute;
    top: 10px;
    right: 14px;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(0,0,0,0.08);
    border: none;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    z-index: 2;
  }

  /* ══════════════ SHARED CARD CONTENT ══════════════ */
  .card-header {
    background: linear-gradient(135deg, var(--forest) 0%, var(--moss) 100%);
    padding: 14px 16px 12px;
    position: relative;
  }
  .card-number { font-size: 10px; color: var(--mist); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 2px; }
  .card-name {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--snow);
    line-height: 1.1;
  }
  .card-peak { font-size: 12px; color: var(--mist); margin-top: 2px; }
  .card-height-badge {
    position: absolute;
    top: 14px; right: 14px;
    background: var(--gold);
    color: var(--ink);
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 15px;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .card-body { padding: 12px 16px 16px; }
  .card-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 9px; }
  .card-row:last-child { margin-bottom: 0; }
  .card-icon { font-size: 14px; margin-top: 1px; flex-shrink: 0; width: 20px; text-align: center; }
  .card-field-label { font-size: 10px; color: var(--stone); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 1px; }
  .card-field-value { font-size: 13px; color: var(--ink); line-height: 1.45; }
  .difficulty-badge {
    display: inline-block; padding: 2px 9px; border-radius: 10px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
  }
  .diff-easy    { background: #d4edda; color: #155724; }
  .diff-medium  { background: #fff3cd; color: #856404; }
  .diff-hard    { background: #f8d7da; color: #721c24; }
  .diff-extreme { background: #d1ecf1; color: #0c5460; }
  .card-divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(74,124,38,0.2), transparent); margin: 8px 0; }
  .region-tag {
    display: inline-block; background: var(--mist); color: var(--forest);
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 8px; margin-right: 4px;
  }

  /* ══════════════ MOBILE SEARCH BAR (bottom) ══════════════ */
  #mobile-search-bar {
    display: none;
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 900;
    width: calc(100% - 90px);
    max-width: 320px;
  }
  #mobile-search-input {
    width: 100%;
    background: rgba(26,26,46,0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 25px;
    padding: 9px 18px;
    color: var(--cream);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    outline: none;
    -webkit-appearance: none;
    min-height: 40px;
  }
  #mobile-search-input::placeholder { color: var(--stone); }
  #mobile-search-input:focus { border-color: var(--gold); }

  @media (max-width: 480px) {
    #mobile-search-bar { display: block; }
  }

  /* ══════════════ LEAFLET ══════════════ */
  .leaflet-container { background: #1a2535; }
  .leaflet-popup-content-wrapper { display: none; }
  .leaflet-control-zoom { margin-bottom: 8px !important; margin-right: 10px !important; }

  @media (max-width: 480px) {
    .leaflet-control-zoom { margin-bottom: 140px !important; }
  }

  /* ══════════════ OVERLAY (sheet 뒷배경) ══════════════ */
  #sheet-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 8999;
    background: rgba(0,0,0,0.3);
    opacity: 0;
    transition: opacity 0.3s;
  }
  #sheet-overlay.show { opacity: 1; }
  @media (max-width: 768px) {
    #sheet-overlay { display: block; pointer-events: none; }
    #sheet-overlay.show { pointer-events: auto; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-icon">⛰️</div>
    <div>
      <div class="header-title">블랙야크 100대 명산</div>
      <div class="header-sub">Black Yak 100 Famous Mountains of Korea</div>
    </div>
  </div>
  <div class="header-stats">
    <div class="stat"><div class="stat-num">100</div><div class="stat-label">명산</div></div>

    <div class="stat"><div class="stat-num">327m</div><div class="stat-label">최저봉 팔봉산</div></div>

</header>

<div id="map-wrap">
  <div id="map"></div>

  <!-- 필터바 (공통) -->

    <button class="filter-btn" data-region="강원">강원</button>

  <!-- 데스크탑 검색 -->
  <div id="search-wrap">
    <input id="search-box" type="text" placeholder="🔍  산 이름 검색...">

  <!-- 고도 범례 (데스크탑) -->
  <div id="legend">

    <div class="legend-item"><div class="legend-dot" style="background:#eab308"></div><span>700–999m</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#84cc16"></div><span>700m 미만</span></div>
  </div>

  <!-- 카운트 뱃지 -->
  <div id="count-badge">표시 <span id="visible-count">100</span>개</div>

  <!-- 모바일 하단 검색 -->
  <div id="mobile-search-bar">
    <input id="mobile-search-input" type="search" placeholder="🔍 산 이름 검색..." autocomplete="off">
  </div>
</div>

<!-- 데스크탑 호버 카드 -->
<div id="mountain-card">

    <div class="card-row">

      <div class="card-icon">⚡</div>

    </div>
  </div>
</div>

<!-- 모바일 바텀 시트 -->
<div id="sheet-overlay"></div>
<div id="bottom-sheet">
  <div class="sheet-handle">
    <div class="sheet-handle-bar"></div>
  </div>
  <button id="sheet-close">✕</button>
  <div class="card-header">
    <div class="card-number" id="s-number"></div>
    <div class="card-name" id="s-name"></div>
    <div class="card-peak" id="s-peak"></div>
    <div class="card-height-badge" id="s-height"></div>
  </div>
  <div class="card-body">
    <div class="card-row">
      <div class="card-icon">📍</div>
      <div><div class="card-field-label">위치</div><div class="card-field-value" id="s-location"></div></div>
    </div>
    <div class="card-divider"></div>
    <div class="card-row">
      <div class="card-icon">⚡</div>
      <div><div class="card-field-label">난이도</div><div class="card-field-value" id="s-difficulty"></div></div>
    </div>
    <div class="card-row">
      <div class="card-icon">🥾</div>
      <div><div class="card-field-label">주요 등산 코스</div><div class="card-field-value" id="s-courses"></div></div>

    <div class="card-row">
      <div class="card-icon">⚡</div>
      <div><div class="card-field-label">최단 코스</div><div class="card-field-value" id="s-short"></div></div>
    </div>
    <div class="card-divider"></div>
    <div class="card-row">

      <div><div class="card-field-label">이름의 어원</div><div class="card-field-value" id="s-etymology"></div></div>
    </div>
  </div>
</div>

  { no:3,  name:"수락산", region:"수도권", loc:"서울 노원구", lat:37.672, lng:127.082, height:637, peak:"주봉",
