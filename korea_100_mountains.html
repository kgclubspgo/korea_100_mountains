<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블랙야크 100대 명산 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --ink: #1a1a2e;
    --forest: #2d5016;
    --moss: #4a7c26;
    --fern: #7ab648;
    --mist: #c8dfa0;
    --stone: #8b9467;
    --cream: #f5f0e8;
    --gold: #c9a84c;
    --peak: #e8320a;
    --snow: #ffffff;
    --card-bg: rgba(245,240,232,0.97);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--ink);
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    position: relative;
    z-index: 1000;
    background: var(--forest);
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--gold);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .header-left { display: flex; align-items: center; gap: 14px; }

  .logo-icon {
    width: 38px; height: 38px;
    background: var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .header-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--cream);
    letter-spacing: -0.3px;
  }

  .header-sub {
    font-size: 11px;
    color: var(--mist);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 1px;
  }

  .header-stats {
    display: flex;
    gap: 24px;
  }

  .stat {
    text-align: center;
    color: var(--cream);
  }

  .stat-num {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
  }

  .stat-label {
    font-size: 10px;
    color: var(--mist);
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  /* ── MAP CONTAINER ── */
  #map-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  #map {
    width: 100%;
    height: 100%;
  }

  /* ── FILTER BAR ── */
  #filter-bar {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 900;
    display: flex;
    gap: 8px;
    background: rgba(26,26,46,0.85);
    backdrop-filter: blur(12px);
    padding: 8px 12px;
    border-radius: 40px;
    border: 1px solid rgba(201,168,76,0.3);
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  .filter-btn {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid transparent;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--mist);
    background: transparent;
    white-space: nowrap;
  }

  .filter-btn:hover { color: var(--snow); border-color: rgba(201,168,76,0.5); }
  .filter-btn.active { background: var(--gold); color: var(--ink); border-color: var(--gold); font-weight: 700; }

  /* ── LEGEND ── */
  #legend {
    position: absolute;
    bottom: 30px;
    left: 14px;
    z-index: 900;
    background: rgba(26,26,46,0.88);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(201,168,76,0.25);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--cream);
    font-size: 11px;
    min-width: 130px;
  }

  #legend h4 {
    font-family: 'Noto Serif KR', serif;
    font-size: 12px;
    color: var(--gold);
    margin-bottom: 8px;
    letter-spacing: 0.3px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
  }

  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.3);
    flex-shrink: 0;
  }

  /* ── HOVER CARD ── */
  #mountain-card {
    position: fixed;
    z-index: 9999;
    width: 320px;
    background: var(--card-bg);
    border-radius: 14px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(201,168,76,0.3);
    opacity: 0;
    pointer-events: none;
    transform: translateY(6px) scale(0.97);
    transition: opacity 0.18s ease, transform 0.18s ease;
    overflow: hidden;
    font-size: 13px;
  }

  #mountain-card.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0) scale(1);
  }

  .card-header {
    background: linear-gradient(135deg, var(--forest) 0%, var(--moss) 100%);
    padding: 16px 18px 14px;
    position: relative;
  }

  .card-number {
    font-size: 10px;
    color: var(--mist);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  .card-name {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--snow);
    line-height: 1.1;
  }

  .card-peak {
    font-size: 12px;
    color: var(--mist);
    margin-top: 3px;
  }

  .card-height-badge {
    position: absolute;
    top: 16px;
    right: 16px;
    background: var(--gold);
    color: var(--ink);
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 16px;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: -0.3px;
  }

  .card-body { padding: 14px 18px 16px; }

  .card-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }

  .card-row:last-child { margin-bottom: 0; }

  .card-icon {
    font-size: 15px;
    margin-top: 1px;
    flex-shrink: 0;
    width: 20px;
    text-align: center;
  }

  .card-field-label {
    font-size: 10px;
    color: var(--stone);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 1px;
  }

  .card-field-value {
    font-size: 13px;
    color: var(--ink);
    line-height: 1.45;
  }

  .difficulty-badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  .diff-easy { background: #d4edda; color: #155724; }
  .diff-medium { background: #fff3cd; color: #856404; }
  .diff-hard { background: #f8d7da; color: #721c24; }
  .diff-extreme { background: #d1ecf1; color: #0c5460; }

  .course-short {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: linear-gradient(90deg, var(--forest), var(--moss));
    color: white;
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 8px;
    margin-left: 5px;
    font-weight: 600;
  }

  .card-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(74,124,38,0.2), transparent);
    margin: 10px 0;
  }

  .region-tag {
    display: inline-block;
    background: var(--mist);
    color: var(--forest);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 8px;
    margin-right: 4px;
    letter-spacing: 0.3px;
  }

  /* ── LEAFLET OVERRIDES ── */
  .leaflet-container { background: #1a2535; }

  .mountain-marker {
    cursor: pointer;
    transition: transform 0.15s;
  }

  .leaflet-popup-content-wrapper {
    display: none;
  }

  /* search box */
  #search-wrap {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 900;
  }

  #search-box {
    background: rgba(26,26,46,0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 25px;
    padding: 7px 16px;
    color: var(--cream);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    width: 180px;
    outline: none;
  }

  #search-box::placeholder { color: var(--stone); }
  #search-box:focus { border-color: var(--gold); }

  /* count badge */
  #count-badge {
    position: absolute;
    bottom: 30px;
    right: 14px;
    z-index: 900;
    background: rgba(26,26,46,0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(201,168,76,0.25);
    border-radius: 8px;
    padding: 8px 14px;
    color: var(--gold);
    font-family: 'Noto Serif KR', serif;
    font-size: 13px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-icon">⛰️</div>
    <div>
      <div class="header-title">블랙야크 100대 명산</div>
      <div class="header-sub">Black Yak 100 Famous Mountains of Korea</div>
    </div>
  </div>
  <div class="header-stats">
    <div class="stat"><div class="stat-num">100</div><div class="stat-label">명산</div></div>
    <div class="stat"><div class="stat-num">1,950m</div><div class="stat-label">최고봉 한라산</div></div>
    <div class="stat"><div class="stat-num">327m</div><div class="stat-label">최저봉 팔봉산</div></div>
  </div>
</header>

<div id="map-wrap">
  <div id="map"></div>

  <div id="filter-bar">
    <button class="filter-btn active" data-region="전체">전체</button>
    <button class="filter-btn" data-region="수도권">수도권</button>
    <button class="filter-btn" data-region="강원">강원</button>
    <button class="filter-btn" data-region="충청">충청</button>
    <button class="filter-btn" data-region="경상">경상</button>
    <button class="filter-btn" data-region="전라">전라</button>
    <button class="filter-btn" data-region="제주">제주</button>
  </div>

  <div id="search-wrap">
    <input id="search-box" type="text" placeholder="🔍  산 이름 검색...">
  </div>

  <div id="legend">
    <h4>🏔 고도 범례</h4>
    <div class="legend-item"><div class="legend-dot" style="background:#e8320a"></div><span>1500m 이상</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div><span>1000 – 1499m</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#eab308"></div><span>700 – 999m</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#84cc16"></div><span>700m 미만</span></div>
  </div>

  <div id="count-badge">표시된 산: <span id="visible-count">100</span>개</div>
</div>

<div id="mountain-card">
  <div class="card-header">
    <div class="card-number" id="c-number"></div>
    <div class="card-name" id="c-name"></div>
    <div class="card-peak" id="c-peak"></div>
    <div class="card-height-badge" id="c-height"></div>
  </div>
  <div class="card-body">
    <div class="card-row">
      <div class="card-icon">📍</div>
      <div>
        <div class="card-field-label">위치</div>
        <div class="card-field-value" id="c-location"></div>
      </div>
    </div>
    <div class="card-divider"></div>
    <div class="card-row">
      <div class="card-icon">⚡</div>
      <div>
        <div class="card-field-label">난이도</div>
        <div class="card-field-value" id="c-difficulty"></div>
      </div>
    </div>
    <div class="card-row">
      <div class="card-icon">🥾</div>
      <div>
        <div class="card-field-label">주요 등산 코스</div>
        <div class="card-field-value" id="c-courses"></div>
      </div>
    </div>
    <div class="card-row">
      <div class="card-icon">⚡</div>
      <div>
        <div class="card-field-label">최단 코스</div>
        <div class="card-field-value" id="c-short"></div>
      </div>
    </div>
    <div class="card-divider"></div>
    <div class="card-row">
      <div class="card-icon">📖</div>
      <div>
        <div class="card-field-label">이름의 어원</div>
        <div class="card-field-value" id="c-etymology"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════

// ── 지역 필터 매핑
const REGION_MAP = {
  "수도권": ["수도권"],
  "강원": ["강원"],
  "충청": ["충청"],
  "경상": ["경상"],
  "전라": ["전라"],
  "제주": ["제주"]
};

// ── 고도별 색상
function getColor(h) {
  if (h >= 1500) return '#e8320a';
  if (h >= 1000) return '#f97316';
  if (h >= 700)  return '#eab308';
  return '#84cc16';
}

// ── 마커 SVG
function makeIcon(mountain, scale = 1) {
  const c = getColor(mountain.height);
  const r = Math.max(7, Math.min(13, 6 + mountain.height / 200)) * scale;
  return L.divIcon({
    className: '',
    iconSize: [r*2+4, r*2+4],
    iconAnchor: [r+2, r+2],
    html: `<svg width="${r*2+4}" height="${r*2+4}" viewBox="0 0 ${r*2+4} ${r*2+4}">
      <circle cx="${r+2}" cy="${r+2}" r="${r}" fill="${c}" stroke="white" stroke-width="1.5" opacity="0.92"/>
      <circle cx="${r+2}" cy="${r+2}" r="${r*0.45}" fill="white" opacity="0.5"/>
    </svg>`
  });
}

// ── 지도 초기화
const map = L.map('map', {
  center: [36.5, 127.8],
  zoom: 7,
  zoomControl: false,
  attributionControl: false
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

L.control.zoom({ position: 'bottomright' }).addTo(map);

// ── 마커 생성
let markers = [];
let activeRegion = "전체";

const card = document.getElementById('mountain-card');
let hideTimer = null;

function showCard(m, e) {
  clearTimeout(hideTimer);
  document.getElementById('c-number').textContent = `NO. ${String(m.no).padStart(2,'0')}  ·  ${m.region}`;
  document.getElementById('c-name').textContent = m.name;
  document.getElementById('c-peak').textContent = `▲ 인증봉우리: ${m.peak}`;
  document.getElementById('c-height').textContent = `${m.height}m`;
  document.getElementById('c-location').innerHTML = `<span class="region-tag">${m.loc.split(' ')[0]}</span>${m.loc}`;
  document.getElementById('c-difficulty').innerHTML = `<span class="difficulty-badge ${m.diffClass}">${m.difficulty}</span>`;

  const courses = m.courses.split('|');
  document.getElementById('c-courses').innerHTML = courses.map(c =>
    `<div style="margin-bottom:3px">• ${c}</div>`
  ).join('');
  document.getElementById('c-short').innerHTML =
    `<span style="color:#2d5016;font-weight:600">⚡ ${m.shortCourse}</span>`;
  document.getElementById('c-etymology').textContent = m.etymology;

  // 위치 조정
  const margin = 12;
  let x = e.originalEvent.clientX + 16;
  let y = e.originalEvent.clientY - 20;
  const cw = 320, ch = 380;
  if (x + cw > window.innerWidth - margin) x = e.originalEvent.clientX - cw - 16;
  if (y + ch > window.innerHeight - margin) y = window.innerHeight - ch - margin;
  if (y < 70) y = 70;

  card.style.left = x + 'px';
  card.style.top = y + 'px';
  card.classList.add('visible');
}

function scheduleHide() {
  hideTimer = setTimeout(() => card.classList.remove('visible'), 200);
}

MOUNTAINS.forEach(m => {
  const marker = L.marker([m.lat, m.lng], { icon: makeIcon(m) })
    .addTo(map)
    .on('mouseover', (e) => showCard(m, e))
    .on('mouseout', scheduleHide)
    .on('click', (e) => showCard(m, e));

  marker._mountainData = m;
  markers.push(marker);
});

// ── 필터
function filterMarkers() {
  const searchVal = document.getElementById('search-box').value.trim();
  let count = 0;
  markers.forEach(mk => {
    const m = mk._mountainData;
    const regionMatch = activeRegion === "전체" || m.region === activeRegion ||
      (activeRegion === "수도권" && (m.region === "수도권"));
    const searchMatch = !searchVal || m.name.includes(searchVal) || m.loc.includes(searchVal);
    if (regionMatch && searchMatch) {
      mk.addTo(map);
      count++;
    } else {
      map.removeLayer(mk);
    }
  });
  document.getElementById('visible-count').textContent = count;
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeRegion = btn.dataset.region;
    filterMarkers();
  });
});

document.getElementById('search-box').addEventListener('input', filterMarkers);

// 카드 호버 유지
card.addEventListener('mouseenter', () => clearTimeout(hideTimer));
card.addEventListener('mouseleave', scheduleHide);
</script>
